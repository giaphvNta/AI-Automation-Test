services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-with-ffmpeg:v1.60.0
    working_dir: /work
    volumes:
      - .:/work
      - playwright_node_modules:/work/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: 1gb
    ipc: host

volumes:
  playwright_node_modules:
